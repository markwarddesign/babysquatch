<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Baby Squatch</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#16231a; overflow:hidden; overscroll-behavior:none; }
  * { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.45); }
  #touch { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between;
           /* kept away from the screen corners, where iPad grabs a drag to resize the window */
           padding:0 calc(56px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(56px + env(safe-area-inset-left));
           pointer-events:none; }
  body.touch #touch { display:flex; }
  .pad { display:flex; gap:14px; pointer-events:auto; }
  .btn { width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5);
         color:#fff; font:600 26px Fredoka, sans-serif; display:flex; align-items:center; justify-content:center; }
  .btn.on { background:rgba(255,255,255,.45); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="pad"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
  <div class="pad"><div class="btn" data-k="down">▼</div><div class="btn" data-k="jump">▲</div></div>
</div>
<script>
'use strict';
/* =========================================================
   BABY SQUATCH — The Long Way Home
   ========================================================= */
const W = 960, H = 540, T = 40, ROWS = 14, STEP = 1 / 120;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const shade = document.createElement('canvas');

let fitW = 0, fitH = 0;
function resize() {
  // iPad windowed mode can fire resize before innerWidth/innerHeight update, so read the layout box directly.
  const de = document.documentElement;
  const vw = Math.max(1, de.clientWidth || innerWidth), vh = Math.max(1, de.clientHeight || innerHeight);
  if (vw === fitW && vh === fitH) return;
  fitW = vw; fitH = vh;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  shade.width = cv.width; shade.height = cv.height;
  scrollTo(0, 0);
}
// Refit on every way the window can change size, then check again after the window settles.
const refit = () => { resize(); requestAnimationFrame(resize); setTimeout(resize, 250); };
addEventListener('resize', refit); addEventListener('orientationchange', refit);
if (window.visualViewport) visualViewport.addEventListener('resize', refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);
setInterval(resize, 1000);
resize();
if (document.fonts) ['400', '600', '700'].forEach(w => document.fonts.load(`${w} 20px Fredoka`));

/* ---------------- helpers ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function heart(x, y, s, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
  ctx.fill();
}

/* ---------------- input ---------------- */
const keys = { left:false, right:false, jump:false, down:false };
let jumpPressed = false, anyPressed = false, isTouch = false, navPressed = 0, downPressed = false, backPressed = false, tapPos = null;
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', ArrowDown:'down', KeyS:'down' };
addEventListener('keydown', e => {
  initAudio();
  const k = KEYMAP[e.code];
  if (k) {
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    if ((k === 'left' || k === 'right') && !keys[k]) navPressed = k === 'left' ? -1 : 1;
    if (k === 'down' && !keys.down) downPressed = true;
    keys[k] = true; e.preventDefault();
  }
  if ((e.code === 'Backspace' || e.code === 'Escape') && G.state === 'select') { backPressed = true; e.preventDefault(); }
  if (e.code === 'Enter' || e.code === 'Space') anyPressed = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyR' && (G.state === 'paused' || G.state === 'gameover')) restartLevel();
  if (e.code === 'KeyQ' && (G.state === 'paused' || G.state === 'gameover' || G.state === 'intro')) quitToMenu();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyG' && (G.state === 'paused' || G.state === 'title')) goClubhouse();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
cv.addEventListener('pointerdown', e => {
  initAudio(); anyPressed = true;
  const r = cv.getBoundingClientRect();
  tapPos = { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
});
function enableTouch() { if (!isTouch) { isTouch = true; document.body.classList.add('touch'); } }
addEventListener('touchstart', enableTouch, { passive:true });
// iPad Safari ignores user-scalable=no, so block pinch, double-tap and long-press zoom by hand.
const noZoom = e => e.preventDefault();
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu'].forEach(t => document.addEventListener(t, noZoom, { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !e.target.closest('.btn')) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });
if (matchMedia('(pointer: coarse)').matches) enableTouch();
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const on = e => {
    e.preventDefault(); initAudio();
    if (k === 'jump' && !keys.jump) { jumpPressed = true; anyPressed = true; }
    if ((k === 'left' || k === 'right') && !keys[k]) navPressed = k === 'left' ? -1 : 1;
    if (k === 'down' && !keys.down) downPressed = true;
    keys[k] = true; b.classList.add('on');
  };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
function consumePress() { if (jumpPressed || anyPressed) { jumpPressed = anyPressed = false; return true; } return false; }

/* ---------------- audio ---------------- */
let actx = null, muted = false;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type = 'square', v = .06, f2 = null, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .1) {
  if (!actx || muted) return;
  const b = actx.createBuffer(1, Math.floor(actx.sampleRate * d), actx.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = b; g.gain.value = v;
  s.connect(g).connect(actx.destination); s.start();
}
const sfx = {
  jump: () => tone(330, .15, 'square', .045, 660),
  berry: () => { tone(880, .08, 'triangle', .08); tone(1320, .12, 'triangle', .08, null, .07); },
  stomp: () => tone(260, .15, 'square', .06, 90),
  boing: () => tone(150, .35, 'sine', .14, 620),
  hurt: () => tone(320, .3, 'sawtooth', .06, 90),
  snap: () => { noise(.15, .3); tone(1800, .05, 'square', .04); },
  cp: () => [523, 659, 784].forEach((f, i) => tone(f, .15, 'triangle', .07, null, i * .09)),
  rescue: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .08, null, i * .11)),
  win: () => [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, .26, 'triangle', .08, null, i * .16)),
  splash: () => noise(.35, .18),
  hide: () => tone(220, .1, 'sine', .06, 140),
};

/* ---------------- character art (SVG -> canvas) ---------------- */
function svgA(o = {}) {

  const eyesSvg = eyes === 'open'
    ? `<ellipse cx="83" cy="73" rx="11" ry="10" fill="#fff"/><circle cx="85" cy="74" r="7" fill="#7a4220"/><circle cx="85" cy="74" r="3.6" fill="#1f0f06"/><circle cx="82.5" cy="71" r="2.2" fill="#fff"/>
       <ellipse cx="117" cy="73" rx="11" ry="10" fill="#fff"/><circle cx="115" cy="74" r="7" fill="#7a4220"/><circle cx="115" cy="74" r="3.6" fill="#1f0f06"/><circle cx="112.5" cy="71" r="2.2" fill="#fff"/>`

       <path d="M85.5 99 Q86 93 88 92.5 Q90 93 90.5 100 Z" fill="#fff"/><path d="M114.5 99 Q114 93 112 92.5 Q110 93 109.5 100 Z" fill="#fff"/>`

  <g transform="translate(${lx} ${ly})">

    <path d="M153 130 Q160 133 158 138 Q164 144 158 150 Q162 158 153 160 Z" fill="${fur}" stroke="${fur}" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="148" cy="186" rx="8" ry="11" fill="${tan}"/>
  </g>
  <path d="M56 90 Q58 112 64 118 Q68 112 70 110 Q72 126 77 128 Q81 118 83 114 Q85 132 91 134 Q95 122 97 120 Q99 136 103 136 Q106 122 104 120 Q107 132 111 134 Q115 128 117 114 Q119 118 123 128 Q128 126 130 110 Q132 112 136 118 Q142 112 144 90 Z" fill="${fur}" stroke="${fur}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M77 112 Q78 120 80 124 M91 116 Q91 124 93 130 M109 116 Q109 124 107 130 M123 112 Q122 120 120 124" stroke="${str}" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M56 48 Q42 52 44 60 Q36 66 44 74 Q36 82 44 88 Q44 96 60 94 Z" fill="${dk}" stroke="${dk}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M144 48 Q158 52 156 60 Q164 66 156 74 Q164 82 156 88 Q156 96 140 94 Z" fill="${dk}" stroke="${dk}" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="100" cy="72" rx="48" ry="42" fill="${fur}"/>
  <path d="M58 56 Q56 36 64 28 Q72 34 76 42 Q76 22 84 14 Q92 22 95 32 Q98 14 104 8 Q112 18 110 32 Q116 18 124 16 Q128 28 124 40 Q132 30 140 30 Q146 44 142 58 Z" fill="${fur}" stroke="${fur}" stroke-width="7" stroke-linejoin="round"/>
  <path d="M84 20 Q86 30 88 38 M104 14 Q104 24 102 34 M123 22 Q120 30 118 38 M66 34 Q69 40 72 46" stroke="${str}" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<g transform="${turn ? `translate(${100 + turn * 17} 0) scale(${1 - turn * .1} 1) translate(-100 0)` : ''}">
  <ellipse cx="82" cy="72" rx="16" ry="14" fill="#dcbf94"/>
  <ellipse cx="118" cy="72" rx="16" ry="14" fill="#dcbf94"/>
  <ellipse cx="100" cy="92" rx="33" ry="18" fill="#dcbf94"/>
  ${eyesSvg}
  <path d="M62 64 Q80 50 98 60 L100 64 L102 60 Q120 50 138 64 L136 69 Q118 58 102 67 L98 67 Q82 58 64 69 Z" fill="${dk}" stroke="${dk}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M91 82 Q100 76 109 82 Q107 90 100 90 Q93 90 91 82 Z" fill="#4a2412"/>
  ${mouthSvg}
  <ellipse cx="72" cy="90" rx="7" ry="4.5" fill="#e58a74" opacity=".35"/>
  <ellipse cx="128" cy="90" rx="7" ry="4.5" fill="#e58a74" opacity=".35"/>
</g>
</svg>`;
}

function svgB(o = {}) {
  const { lx=0, ly=0, rx=0, ry=0, al=0, ar=0, eyes='open', turn=0 } = o;
  const gold = '#c98a30';
  const eyesSvg = eyes === 'open'
    ? `<circle cx="89" cy="80" r="5.8" fill="#14100c"/><circle cx="87.4" cy="78.2" r="1.8" fill="#fff"/><circle cx="111" cy="80" r="5.8" fill="#14100c"/><circle cx="109.4" cy="78.2" r="1.8" fill="#fff"/>`
    : `<path d="M83 80 Q89 84 95 80 M105 80 Q111 84 117 80" stroke="#14100c" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <filter id="shag" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="240">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="gold" cx="45%" cy="35%" r="75%"><stop offset="0" stop-color="#dc9a3c"/><stop offset="1" stop-color="#b0701f"/></radialGradient>

  </defs>
  <g transform="translate(${lx} ${ly})"><ellipse cx="82" cy="196" rx="17" ry="28" fill="url(#gold)" filter="url(#shag)"/><ellipse cx="82" cy="222" rx="13" ry="7" fill="url(#tan)"/></g>
  <g transform="translate(${rx} ${ry})"><ellipse cx="118" cy="196" rx="17" ry="28" fill="url(#gold)" filter="url(#shag)"/><ellipse cx="118" cy="222" rx="13" ry="7" fill="url(#tan)"/></g>
  <g transform="rotate(${al} 78 122)"><path d="M78 122 L36 148" stroke="${gold}" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#shag)"/><ellipse cx="32" cy="151" rx="11" ry="8" fill="url(#tan)" transform="rotate(-30 32 151)"/></g>
  <g transform="rotate(${ar} 122 122)"><path d="M122 122 L160 162" stroke="${gold}" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#shag)"/><ellipse cx="164" cy="166" rx="11" ry="8" fill="url(#tan)" transform="rotate(45 164 166)"/></g>
  <ellipse cx="100" cy="152" rx="32" ry="40" fill="url(#gold)" filter="url(#shag)"/>
  <path d="M80 118 Q100 112 120 118 L118 150 Q100 158 82 150 Z" fill="url(#tan)"/>
  <g stroke="#9a7650" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M100 120 L100 140"/><path d="M84 132 Q92 138 100 134 Q108 138 116 132"/><path d="M87 148 Q100 152 113 148"/></g>
  <circle cx="56" cy="82" r="9" fill="#cfa679"/><circle cx="144" cy="82" r="9" fill="#cfa679"/>
  <ellipse cx="100" cy="78" rx="46" ry="46" fill="url(#gold)" filter="url(#shag)"/>
<g transform="${turn ? `translate(${100 + turn * 16} 0) scale(${1 - turn * .1} 1) translate(-100 0)` : ''}">
  <ellipse cx="100" cy="84" rx="27" ry="33" fill="url(#tan)"/>
  <ellipse cx="100" cy="100" rx="19" ry="14" fill="#e9cfaa"/>
  <path d="M86 62 Q100 57 114 62 M88 67 Q100 63 112 67" stroke="#9a7650" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  ${eyesSvg}
  <ellipse cx="96" cy="95" rx="1.8" ry="1.3" fill="#7a5a3a"/><ellipse cx="104" cy="95" rx="1.8" ry="1.3" fill="#7a5a3a"/>
  <path d="M89 104 Q100 111 111 104" stroke="#6e4f30" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>
</svg>`;
}

// spiky shag outline around an ellipse (for the wild-haired squatch)
function shagPath(cx, cy, rx, ry, n, len, seed, a0 = 0, a1 = Math.PI * 2, droop = 0) {
  let d = '';
  const step = (a1 - a0) / n;
  for (let i = 0; i <= n; i++) {
    const a = a0 + step * i;
    d += (i ? ' L' : 'M') + (cx + Math.cos(a) * rx).toFixed(1) + ' ' + (cy + Math.sin(a) * ry).toFixed(1);
    if (i < n) {
      const am = a + step * (.5 + (hash(seed + i * 1.3) - .5) * .5), L = len * (.55 + .75 * hash(seed + i * 3.7));
      d += ' L' + (cx + Math.cos(am) * (rx + L)).toFixed(1) + ' ' + (cy + Math.sin(am) * (ry + L) + droop * L).toFixed(1);
    }
  }
  return d + ' Z';
}

function svgC(o = {}) {
  const { lx=0, ly=0, rx=0, ry=0, al=0, ar=0, eyes='open', mouth='smile', turn=0 } = o;
  const fur = '#9a4c20', hi = '#bd6a2f', dk = '#6c3214', tan = '#e0bf90', tanD = '#c99e6c';
  const strands = (pts, col, w) => `<path d="${pts}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const foot = (cx, flip) => {
    const s = flip ? -1 : 1;
    return `<g transform="translate(${cx} 214) scale(${s} 1) rotate(-10)">
      <ellipse cx="0" cy="0" rx="29" ry="14" fill="${tan}"/>
      <ellipse cx="2" cy="5" rx="24" ry="8" fill="${tanD}" opacity=".45"/>
      <path d="M-22 -4 Q-18 2 -21 8 M-13 -9 Q-9 0 -12 10 M-3 -11 Q1 0 -2 11" stroke="${tanD}" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>`;
  };
  const arm = (side, rot) => {
    const x = side < 0 ? 66 : 134, hx = side < 0 ? 48 : 152;
    return `<g transform="rotate(${rot} ${x} 122)">
      <path d="${shagPath(x + side * 9, 146, 13, 26, 11, 9, side < 0 ? 21 : 31)}" fill="${fur}" filter="url(#shag)"/>
      <ellipse cx="${hx}" cy="174" rx="13" ry="15" fill="${tan}"/>
      <path d="M${hx - 6} 182 Q${hx - 5} 177 ${hx - 6} 172 M${hx} 185 Q${hx + 1} 179 ${hx} 173 M${hx + 6} 182 Q${hx + 5} 177 ${hx + 6} 172" stroke="${tanD}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>`;

  const eyesSvg = eyes === 'open'

function drawSprite(name, cx, bottom, dw, flip = false, sx = 1, sy = 1, alpha = 1, lean = 0) {

  ctx.restore();
}

/* ---------------- generated levels (so every adventure has 10) ---------------- */
function rng32(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Trail pieces. Each starts and ends on normal ground (row 11) so they join up, and reports
// a perch (where the pie bandit can land) and a spot (where a journal page can float).
const CHUNK_W = { meadow:10, steps:12, pit:11, pond:12, plateau:14, bear:14, patrol:16, bees:12, critters:12, hop:15 };
const CHUNKS = {
  meadow(a, x, d, r) { a.ground(x, x + 9, 11); a.berries(x + 2, 10, 3); if (r() < .6) a.add('bush', x + 6, 10); if (d >= 1 && r() < .7) a.add(r() < .5 ? 'raccoon' : 'skunk', x + 8, 10); return { perch:[x + 7, 10], spot:[x + 5, 8] }; },
  steps(a, x, d) { a.ground(x, x + 11, 11); a.plat(x + 2, 8, 3); a.plat(x + 6, 6, 3); a.berries(x + 6, 5, 3); if (d >= 2) a.add('bee', x + 9, 4); return { perch:[x + 7, 5], spot:[x + 3, 6] }; },
  pit(a, x) { a.ground(x, x + 3, 11); a.plat(x + 5, 9, 2); a.ground(x + 8, x + 10, 11); a.berries(x + 5, 8, 2); return { perch:[x + 5, 8], spot:[x + 6, 6] }; },
  pond(a, x, d, r) { a.ground(x, x + 3, 11); a.water(x + 4, x + 7); a.plat(x + 5, 9, 2); a.ground(x + 8, x + 11, 11); a.berries(x + 5, 8, 2); if (d >= 3 && r() < .6) a.add('raccoon', x + 10, 10); return { perch:[x + 9, 10], spot:[x + 6, 6] }; },
  plateau(a, x, d, r) { a.ground(x, x + 13, 11); a.ground(x + 4, x + 9, 9); a.berries(x + 5, 7, 3); if (d >= 1) a.add(d >= 4 && r() < .5 ? 'skunk' : 'raccoon', x + 7, 8); if (r() < .5) a.add('bush', x + 12, 10); return { perch:[x + 6, 8], spot:[x + 11, 8] }; },
  bear(a, x) { a.ground(x, x + 13, 11); a.add('bear', x + 7, 10); a.plat(x + 4, 5, 5); a.berries(x + 4, 4, 5); return { perch:[x + 11, 10], spot:[x + 12, 8] }; },
  patrol(a, x, d) { a.ground(x, x + 15, 11); a.add('bush', x + 3, 10); a.add('bush', x + 12, 10); a.add(d >= 3 ? 'ranger' : 'hiker', x + 8, 10, { range:4 }); a.plat(x + 6, 8, 4); a.berries(x + 6, 7, 4); return { perch:[x + 7, 7], spot:[x + 14, 8] }; },
  bees(a, x) { a.ground(x, x + 11, 11); a.plat(x + 3, 8, 3); a.plat(x + 7, 7, 3); a.add('bee', x + 6, 5); a.berries(x + 7, 6, 3); return { perch:[x + 8, 6], spot:[x + 4, 6] }; },
  critters(a, x, d) { a.ground(x, x + 11, 11); a.add('skunk', x + 4, 10); if (d >= 2) a.add('raccoon', x + 9, 10); a.berries(x + 2, 10, 2); a.berries(x + 7, 9, 2); a.add('bush', x + 11, 10); return { perch:[x + 6, 10], spot:[x + 6, 8] }; },
  hop(a, x) { a.ground(x, x + 2, 11); a.plat(x + 4, 9, 2); a.plat(x + 8, 8, 2); a.ground(x + 12, x + 14, 11); a.berries(x + 8, 7, 2); return { perch:[x + 8, 7], spot:[x + 4, 7] }; },
};
const START_W = 7, END_W = 10;
function genLevel(o) {
  const r = rng32(o.seed), n = 5 + Math.floor(o.d / 2);
  const pool = ['meadow', 'steps', 'pit', 'plateau', 'critters', 'pond', 'patrol', 'bear', ...(o.d >= 2 ? ['bees'] : []), ...(o.d >= 3 ? ['hop'] : [])];
  const list = [];
  for (let k = 0; k < n; k++) { let t; do t = pool[Math.floor(r() * pool.length)]; while (t === list[k - 1]); list.push(t); }
  if (o.lostAt != null) list[o.lostAt] = 'meadow';
  const w = START_W + list.reduce((s, t) => s + CHUNK_W[t], 0) + END_W + (o.end ? 4 : 0);
  return {
    name:o.name, sky:o.sky, w, goal:o.goal, girl:o.girl, needSib:o.lostAt != null, kiteAhead:o.kiteAhead, tips:o.tips, girlTips:o.girlTips,
    finds:o.finds, rain:o.rain, win:o.win,
    build(a) {
      const r2 = rng32(o.seed * 7 + 3);
      a.ground(0, START_W - 1, 11); a.add('start', 4, 10);
      if (o.table) a.add('table', 1, 10); else a.berries(1, 10, 2);
      let x = START_W; const perches = [], spots = [];
      list.forEach((t, k) => {
        if (k && k % 3 === 0) a.add('cp', x + 1, 10);
        const c = CHUNKS[t](a, x, o.d, r2); perches.push(c.perch); spots.push(c.spot);
        if (k === o.lostAt) a.add('lost', x + 4, 10, { who:o.finds });
        x += CHUNK_W[t];
      });
      if (o.end === 'den') { a.ground(x, x + END_W + 3, 11); a.add('den', x + 7, 10); }

  }

    else { G.hasSib = true; banner(s.kind === 'lost' ? `You found ${nameOf(G.follow)}! Lead her back to camp.` : `You found ${nameOf(G.follow)}!`, 3); }
    emit(14, s.x, s.bottom - 40, 'heart', { color:'#ff7a93', g:-60, life:1.2, spread:140, size:10 });
    emit(12, s.x, s.bottom - 60, 'rope', { color:'#c9a46a', life:.8, spread:220 });

      if (L.needSib && E.sib && !E.sib.freed) wait = `Wait! Find ${nameOf(E.sib.who || G.follow)} first.`;
      else if (left) wait = `${left} more page${left > 1 ? 's' : ''} to find on this trail!`;
      if (wait) { if (!G.banner || G.banner.t < 1) banner(wait, 2); }

    P.x = E.den.x - 20 - P.w / 2; P.face = 1; G.winX = E.den.x; G.winY = E.den.bottom - 110;
    return;
  }

  for (const pg of E.pages) {
    if (!pg.got && Math.abs(pg.x - (p.x + p.w / 2)) < 26 && Math.abs(pg.y - (p.y + p.h / 2)) < 36) {
      pg.got = true; G.pages++; sfx.cp();
      banner(G.pages < G.pagesTotal ? `Page ${G.pages} of ${G.pagesTotal}!` : 'All pages found! Back to Lena!', 1.6);
      emit(10, pg.x, pg.y, 'spark', { color:'#fff6c8', g:0, life:.6, spread:200, vy:-60 });
    }
  }
  const k = E.kite;
  if (k && !k.got && Math.abs(k.x - (p.x + p.w / 2)) < 30 && Math.abs(k.y - (p.y + p.h / 2)) < 40) {
    k.got = true; G.kite = true; sfx.rescue(); banner('Got the kite! Now take it to Hannah.', 2.4);
    emit(14, k.x, k.y, 'spark', { color:'#ffd23f', g:0, life:.7, spread:220, vy:-60 });

    if (L.goal === 'chase' && !G.pie) msg = 'That sneaky raccoon still has the pie!';
    if (msg) { if (!G.banner || G.banner.t < 1) banner(msg, 2); }
    else {
      G.state = 'win'; G.timer = 2.5; sfx.win(); P.vx = 0; P.crouch = false; P.hidden = false; P.face = 1; finishAdventure();
      G.winX = gl.x + 10; G.winY = gl.bottom - 110; G.banner = null; P.x = gl.x - 96 - P.w / 2; P.y = gl.bottom - P.h; P.vy = 0;

  // humans

    c.x += c.dir * c.speed * dt; c.walkT += dt;

      } else if (stomp) {
        c.dead = true; c.vy = -420; c.fade = 1; c.dir = p.x < c.x ? 1 : -1;
        p.y = c.y - p.h; p.vy = -480; p.jumping = false; sfx.stomp();
        emit(8, c.x + c.w / 2, c.y, 'poof', { color:'rgba(255,255,255,.9)', g:0, life:.4, size:7, spread:180 });
        if (c.type === 'skunk') emit(10, c.x + c.w / 2, c.y, 'stink', { color:'#9bd35a', size:9, g:-40, life:1, spread:100 });
      } else hurt(c);
    }
  }
  E.critters = E.critters.filter(c => !c.dead || c.fade > 0);
  // bees
  for (const b of E.bees) {
    b.t += dt; b.x = b.x0 + Math.sin(b.t * 1.2) * 55 - 9; b.y = b.y0 + Math.sin(b.t * 2.4) * 18 - 7; b.dir = Math.cos(b.t * 1.2) > 0 ? 1 : -1;

  }

  // sibling trail
  if (G.hasSib || G.crew.length) { hist.push({ x:p.x + p.w / 2, b:p.y + p.h, face:p.face, air:!p.onGround }); if (hist.length > 110) hist.shift(); }
  G.whee = Math.max(0, G.whee - dt);

  // camera
  const tx = clamp(p.x + p.w / 2 - W * .42 + p.face * 40, 0, L.w * T - W);
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  const ty = clamp(p.y - 280, 0, ROWS * T - H);
  cam.y += (ty - cam.y) * Math.min(1, dt * 4);
}

const charById = id => CHARS.find(c => c.id === id);
const CARD = { y:132 };
// what's on screen for the current select step
function selItems() {
  if (SEL.step === 'hero') return CHARS.filter(c => c.group === SEL.group).map(c => ({ kind:'char', c, blocked:false }));
  if (SEL.step === 'adv') return ADVENTURES.filter(a => !a.only || a.only === G.hero).map(a => ({ kind:'adv', a, blocked:a.girl === G.hero }));
  return CHARS.filter(c => !c.girl).map(c => ({ kind:'char', c, blocked:c.id === G.hero }));
}
function cardGeom(n) { return n >= 6 ? { w:146, h:288, gap:154 } : n === 5 ? { w:172, h:288, gap:184 } : n === 4 ? { w:204, h:288, gap:222 } : { w:210, h:288, gap:250 }; }
const cardX = (i, n) => W / 2 + (i - (n - 1) / 2) * cardGeom(n).gap;
const PILLS = { y:88, h:34, w:132 };
function firstOpen(items, pref) { if (pref >= 0 && items[pref] && !items[pref].blocked) return pref; return Math.max(0, items.findIndex(it => !it.blocked)); }
function goStep(step) {
  SEL.step = step; SEL.t = 0;
  const items = selItems();
  let pref = -1;
  if (step === 'hero') pref = items.findIndex(it => it.c.id === G.hero);
  if (step === 'adv') pref = items.findIndex(it => it.a === G.adv);
  if (step === 'sib') pref = items.findIndex(it => it.c.id === G.sib);
  SEL.i = firstOpen(items, pref);
}
function updateSelect(dt) {
  SEL.t += dt;
  let items = selItems();
  if (downPressed && SEL.step === 'hero') { SEL.group = SEL.group === 'girl' ? 'squatch' : 'girl'; SEL.i = 0; SEL.t = 0; sfx.hide(); items = selItems(); }
  downPressed = false;
  if (navPressed) {
    let n = SEL.i, tries = 0;
    do { n = (n + navPressed + items.length) % items.length; } while (items[n].blocked && ++tries < 8);
    if (n !== SEL.i) { SEL.i = n; SEL.t = 0; sfx.jump(); }
    navPressed = 0;
  }
  let confirm = false;
  if (tapPos) {
    const n = items.length, g = cardGeom(n);
    const hit = items.findIndex((it, i) => Math.abs(tapPos.x - cardX(i, n)) < g.w / 2 && tapPos.y > CARD.y && tapPos.y < CARD.y + g.h);
    if (hit >= 0 && !items[hit].blocked) { SEL.i = hit; confirm = true; }
    else if (SEL.step === 'hero' && Math.abs(tapPos.y - (PILLS.y + PILLS.h / 2)) < PILLS.h) {
      const grp = tapPos.x < W / 2 ? 'squatch' : 'girl';
      if (grp !== SEL.group) { SEL.group = grp; SEL.i = 0; SEL.t = 0; sfx.hide(); }
    }
    else if (tapPos.y > H - 60 && tapPos.x < 160) backPressed = true;
    tapPos = null; anyPressed = false; jumpPressed = false;
  }
  if (backPressed) {
    backPressed = false; sfx.hide();
    if (SEL.step === 'sib') goStep('adv');
    else if (SEL.step === 'adv') { goStep('hero'); }
    else G.state = 'title';
    return;
  }
  if (confirm || consumePress()) {
    const it = items[SEL.i]; if (!it || it.blocked) return;
    sfx.cp();
    if (SEL.step === 'hero') { G.hero = it.c.id; goStep('adv'); }
    else if (SEL.step === 'adv') {
      G.adv = it.a;
      if (it.a.id === 'home') goStep('sib'); else beginAdventure();
    } else { G.sib = it.c.id; beginAdventure(); }
  }
}
function beginAdventure() {
  if (G.sib === G.hero || isGirl(G.sib)) G.sib = CHARS.find(c => !c.girl && c.id !== G.hero).id;
  if (G.adv.id === 'piggy') G.sib = 'B';   // Teddy's Mama waits at the den
  try { localStorage.setItem('squatchPick', JSON.stringify({ hero:G.hero, sib:G.sib, adv:G.adv.id })); } catch (e) {}
  const from = PROG[G.adv.id] || 0;
  startGame(from > 0 && from < G.adv.levels.length ? from : 0);
}

function update(dt) {
  G.time += dt;
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  G.flash = Math.max(0, G.flash - dt * 1.6);
  switch (G.state) {
    case 'title':
      if (tapPos && tapPos.x > CLUB_BTN.x && tapPos.x < CLUB_BTN.x + CLUB_BTN.w && tapPos.y > CLUB_BTN.y && tapPos.y < CLUB_BTN.y + CLUB_BTN.h) { goClubhouse(); tapPos = null; anyPressed = false; break; }
      if (consumePress()) { G.state = 'select'; SEL.group = isGirl(G.hero) ? 'girl' : 'squatch'; goStep('hero'); sfx.hide(); }
      navPressed = 0; tapPos = null;
      break;
    case 'select': updateSelect(dt); break;
    case 'intro': if (consumePress()) G.state = 'play'; break;
    case 'play': updatePlay(dt); break;
    case 'mishap':
      G.timer -= dt;
      if (G.timer <= 0) { if (G.hearts <= 0) G.state = 'gameover'; else respawn(); }
      jumpPressed = anyPressed = false;
      break;
    case 'gameover': if (consumePress()) loadLevel(G.level, true); break;
    case 'win':
      G.timer -= dt;
      cam.x += (clamp(G.winX - W / 2, 0, L.w * T - W) - cam.x) * Math.min(1, dt * 3);
      if (Math.random() < dt * 4) emit(1, G.winX + 40 + (Math.random() - .5) * 60, G.winY, 'heart', { color:'#ff7a93', g:-50, life:1.6, spread:40, vy:-30, size:12 });
      if (G.timer <= 0 && consumePress()) G.state = 'title';
      break;
    case 'paused':
      jumpPressed = false;
      if (tapPos) {
        const b = MENU_BTNS.find(b => tapPos.x > b.x && tapPos.x < b.x + b.w && tapPos.y > b.y && tapPos.y < b.y + b.h);
        tapPos = null; anyPressed = false;
        if (b && b.key === 'P') togglePause(); else if (b && b.key === 'R') restartLevel(); else if (b && b.key === 'Q') quitToMenu(); else if (b && b.key === 'G') goClubhouse();
      }
      break;
  }
  if (G.state !== 'paused') updateParticles(dt);
}

const SKIES = {
  day:{ top:'#8fd0f2', bot:'#e6f6ff', mtn:'#9db8c9', snow:'#f4f8fb', far:'#6f9f7a', near:'#3f6f4c', dirt:'#8a5a34', dirtDk:'#73482a', grass:'#62b043', grassDk:'#4b9133' },
  sunset:{ top:'#f39a6b', bot:'#fde3b6', mtn:'#b98a8f', snow:'#f7d8cf', far:'#7a6070', near:'#4d3f54', dirt:'#7d4f33', dirtDk:'#653f28', grass:'#7fa648', grassDk:'#628a36' },
  night:{ top:'#0a1330', bot:'#26345e', mtn:'#26314f', snow:'#5a6a8f', far:'#1a2540', near:'#111a30', dirt:'#5c4030', dirtDk:'#4a3326', grass:'#3f7a45', grassDk:'#2f6036' },
};

function pine(x, b, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x - h * .04, b - h * .15, h * .08, h * .15);
  for (let i = 0; i < 3; i++) {
    const w = h * (.42 - i * .09), y0 = b - h * .12 - i * h * .26, top = y0 - h * .42;
    ctx.beginPath(); ctx.moveTo(x - w, y0); ctx.lineTo(x, top); ctx.lineTo(x + w, y0); ctx.fill();
  }
}
function layerPeaks(off, sp, minH, maxH, col, snow, seed) {
  const base = H - 40, start = Math.floor(off / sp) - 1;
  for (let i = start; i < start + W / sp + 3; i++) {
    const x = i * sp - off, h = minH + hash(i * 3.1 + seed) * (maxH - minH), hw = sp * .8;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - hw, base); ctx.lineTo(x, base - h); ctx.lineTo(x + hw, base); ctx.fill();
    const d = h * .22, sw = d * hw / h;
    ctx.fillStyle = snow; ctx.beginPath(); ctx.moveTo(x, base - h);
    ctx.lineTo(x - sw, base - h + d); ctx.lineTo(x - sw / 3, base - h + d * .75); ctx.lineTo(x, base - h + d); ctx.lineTo(x + sw / 3, base - h + d * .75); ctx.lineTo(x + sw, base - h + d); ctx.fill();
  }
}
function layerTrees(off, sp, baseY, col, maxH, seed) {
  const start = Math.floor(off / sp) - 2;
  for (let i = start; i < start + W / sp + 4; i++) {
    const x = i * sp - off + hash(i + seed * 17) * sp * .5, h = maxH * (.6 + hash(i * 1.7 + seed) * .4);
    pine(x, baseY + 4, h, col);

}
function cloud(x, y, s) {

}
function drawBackground(sk, cx) {
  const S = SKIES[sk];

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    for (let i = 0; i < 110; i++) {
      const span = W * 1.5, x = ((hash(i) * span - cx * .03) % span + span) % span, y = hash(i + 99) * H * .6;
      ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(G.time * 1.3 + i)); ctx.fillRect(x, y, 1.8, 1.8);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,248,216,.12)'; circle(790, 95, 60);
    ctx.fillStyle = '#fff8d8'; circle(790, 95, 34);

  if (E.den) drawDen(E.den);

  E.pages.forEach(pg => { if (!pg.got) drawPage(pg); });
  if (E.kite) drawKite(E.kite);
  if (L.kiteAhead) drawKiteAhead();
  E.tables.forEach(drawTable);
  E.logs.forEach(drawLog);
  E.berries.forEach(b => { if (!b.got) drawBerry(b); });
  E.humans.forEach(drawCone);
  E.humans.forEach(drawHuman);
  E.critters.forEach(drawCritter);
  if (E.thief) drawThief(E.thief);
  E.bees.forEach(drawBee);
  drawSibling();
  drawCrew();
  drawPlayer();
  for (const b of E.bushes) {
    const inside = P.hidden && Math.abs(b.x - (P.x + P.w / 2)) < 30;
    drawBush(b, inside);
    if (inside) {
      const ey = b.bottom - 30, blink = G.time % 2.5 < .12;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(b.x - 7, ey, 5, blink ? .8 : 5.5, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(b.x + 7, ey, 5, blink ? .8 : 5.5, 0, 0, 7); ctx.fill();
      if (!blink) { ctx.fillStyle = '#1f0f06'; circle(b.x - 6 + P.face, ey + .5, 2.6); circle(b.x + 8 + P.face, ey + .5, 2.6); }
    }
  }
  drawParticles();
  ctx.restore();
  if (L.sky === 'night') drawDarkness(cx, cy);
  if (L.rain === true) drawRain();
  ctx.save(); ctx.translate(-cx, -cy); E.humans.forEach(drawMarker); ctx.restore();
}

function drawHUD() {
  ctx.save();
  const extra = L.goal === 'collect' ? 104 : ((L.goal === 'fetch' && G.kite) || G.pie) ? 44 : 0;
  const pals = G.hasSib ? [G.follow] : L.goal === 'piggy' ? ['B'] : G.crew;   // who's with you
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(12, 10, 236 + pals.length * 36 + extra, 42, 21); ctx.fill();
  for (let i = 0; i < 3; i++) heart(38 + i * 30, 19, 24, i < G.hearts ? '#ff5a6e' : 'rgba(255,255,255,.25)');
  drawBerry({ x:140, y:33, ph:0 });
  ctx.fillStyle = '#fff'; ctx.font = '600 22px Fredoka, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('× ' + G.berries, 156, 32);
  pals.forEach((id, j) => drawSprite(id + '_idle', 258 + j * 34, 50, charW(id, 34, true)));
  const ex = 252 + pals.length * 36;
  if (L.goal === 'collect') { drawPage({ x:ex + 6, y:31, ph:0 }); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = '600 22px Fredoka, sans-serif'; ctx.fillText(`${G.pages}/${G.pagesTotal}`, ex + 26, 32); }
  if (L.goal === 'fetch' && G.kite) drawKiteShape(ex + 10, 26, .45);
  if (G.pie) drawPie(ex + 16, 38, .55);
  ctx.textAlign = 'right'; ctx.font = '600 18px Fredoka, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.3)'; const label = `${advStep()}/${G.adv.levels.length} ${L.name}`; const tw = ctx.measureText(label).width;
  rr(W - tw - 86, 12, tw + 28, 36, 18); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(label, W - 72, 31);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(PAUSE_BTN.x - 6, PAUSE_BTN.y - 7, 4, 14); ctx.fillRect(PAUSE_BTN.x + 2, PAUSE_BTN.y - 7, 4, 14);
  if (muted) { ctx.font = '400 14px Fredoka, sans-serif'; ctx.fillText('sound off (M)', W - 26, 64); }
  if (P.hidden) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(40,110,50,.85)'; rr(W / 2 - 60, H - 52, 120, 34, 17); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 18px Fredoka, sans-serif'; ctx.fillText('Hidden', W / 2, H - 34);
  }
  if (G.banner) {
    const a = Math.min(1, G.banner.t * 3);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.font = '600 24px Fredoka, sans-serif';
    const bw = ctx.measureText(G.banner.text).width + 48;
    ctx.fillStyle = 'rgba(255,250,240,.95)'; rr(W / 2 - bw / 2, 66, bw, 46, 23); ctx.fill();
    ctx.fillStyle = '#3b2a1e'; ctx.fillText(G.banner.text, W / 2, 90);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function panel(title, lines, foot, titleColor = '#3b2a1e') {
  ctx.save();
  ctx.fillStyle = 'rgba(10,20,15,.5)'; ctx.fillRect(0, 0, W, H);
  const pw = 620, ph = 120 + lines.length * 32 + (foot ? 44 : 0), px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = '#fffaf0'; rr(px, py, pw, ph, 26); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = titleColor; ctx.font = '700 42px Fredoka, sans-serif';
  const ttw = ctx.measureText(title).width; if (ttw > pw - 50) ctx.font = `700 ${Math.floor(42 * (pw - 50) / ttw)}px Fredoka, sans-serif`;
  ctx.fillText(title, W / 2, py + 62);
  ctx.fillStyle = '#5a4a3c'; ctx.font = '400 21px Fredoka, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, py + 104 + i * 32));
  if (foot) { ctx.globalAlpha = .6 + .4 * Math.sin(G.time * 4); ctx.fillStyle = '#2f7a3a'; ctx.font = '600 21px Fredoka, sans-serif'; ctx.fillText(foot, W / 2, py + ph - 28); ctx.globalAlpha = 1; }
  ctx.restore();
}
const pressText = () => isTouch ? 'Tap to continue' : 'Press Space to continue';

function drawTitleBg() {
  drawBackground('day', G.time * 40);
  ctx.fillStyle = '#62b043'; ctx.fillRect(0, 440, W, 14); ctx.fillStyle = '#8a5a34'; ctx.fillRect(0, 452, W, 100);
  ctx.fillStyle = '#4b9133'; ctx.fillRect(0, 448, W, 6);
}
function idleFrame(id, seed) {
  if (Math.floor(G.time * 2 + seed) % 7 === 0) return id + '_jump';
  return (G.time + seed) % 3.4 < .12 ? id + '_blink' : id + '_idle';
}
function drawTitle() {
  drawTitleBg();
  [[60, 'C', 118, false, 2.1], [158, 'B', 118, false, 0], [243, 'A', 118, false, 1.3], [346, 'CL', 118, true, .7], [425, 'LE', 118, true, 2.6],
   [509, 'HA', 118, true, 1.9], [604, 'MO', 118, true, 4.1], [706, 'DA', 118, true, 5.2], [826, 'GK', 118, true, 3.3]].forEach(([x, id, w, flip, sd]) =>
    drawSprite(idleFrame(id, sd), x, 452, charW(id, w), flip, 1, 1 + Math.sin(G.time * 2.4 + sd) * .012));
  ctx.save();
  const cb = CLUB_BTN;
  ctx.fillStyle = 'rgba(255,250,240,.9)'; rr(cb.x, cb.y, cb.w, cb.h, 20); ctx.fill();
  ctx.fillStyle = '#3b2a1e'; ctx.font = '600 18px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('‹ Game Clubhouse', cb.x + cb.w / 2, cb.y + cb.h / 2 + 1); ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(59,42,30,.25)'; ctx.font = '700 78px Fredoka, sans-serif'; ctx.fillText('Baby Squatch', W / 2 + 4, 104);
  ctx.fillStyle = '#3b2a1e'; ctx.fillText('Baby Squatch', W / 2, 100);
  ctx.fillStyle = '#2f5a3a'; ctx.font = '600 28px Fredoka, sans-serif'; ctx.fillText('The Long Way Home', W / 2, 140);
  ctx.fillStyle = 'rgba(255,250,240,.9)'; rr(W / 2 - 300, 470, 600, 58, 20); ctx.fill();
  ctx.fillStyle = '#5a4a3c'; ctx.font = '400 17px Fredoka, sans-serif';
  ctx.fillText(isTouch ? '◀ ▶ move   ▲ jump   ▼ hide in bushes' : '← → move   Space / ↑ jump   ↓ hide in bushes   P pause   M mute', W / 2, 494);
  ctx.globalAlpha = .6 + .4 * Math.sin(G.time * 4); ctx.fillStyle = '#2f7a3a'; ctx.font = '600 20px Fredoka, sans-serif';
  ctx.fillText(isTouch ? 'Tap to start' : 'Press Space to start', W / 2, 518); ctx.globalAlpha = 1;
  ctx.restore();
}

function drawSelect() {
  drawTitleBg();
  ctx.fillStyle = 'rgba(20,35,25,.25)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const girlHero = isGirl(G.hero);
  const heading = SEL.step === 'hero' ? 'Who do you want to be?' : SEL.step === 'adv' ? 'Pick an adventure' : girlHero ? 'Which baby squatch needs help?' : 'Who got lost at camp?';
  const sub = SEL.step === 'adv' ? `Playing as ${nameOf(G.hero)}` : SEL.step === 'sib' ? (girlHero ? 'You\'ll rescue it and take it home to Mama.' : 'Pick the little sibling you\'ll rescue.') : '';
  ctx.fillStyle = 'rgba(59,42,30,.25)'; ctx.font = '700 46px Fredoka, sans-serif'; ctx.fillText(heading, W / 2 + 3, 62);
  ctx.fillStyle = '#fffaf0'; ctx.fillText(heading, W / 2, 59);
  if (sub) { ctx.font = '400 20px Fredoka, sans-serif'; ctx.fillText(sub, W / 2, 104); }
  if (SEL.step === 'hero') {
    [['squatch', 'Squatches', W / 2 - PILLS.w - 6], ['girl', 'Family', W / 2 + 6]].forEach(([g, label, x]) => {
      const on = SEL.group === g;
      ctx.fillStyle = on ? '#ffb83f' : 'rgba(255,250,240,.55)'; rr(x, PILLS.y, PILLS.w, PILLS.h, 17); ctx.fill();
      ctx.fillStyle = on ? '#3b2a1e' : '#5a4a3c'; ctx.font = '600 18px Fredoka, sans-serif'; ctx.fillText(label, x + PILLS.w / 2, PILLS.y + 23);
    });
  }
  const items = selItems(), n = items.length, g = cardGeom(n);
  items.forEach((it, i) => {
    const x = cardX(i, n), sel = SEL.i === i;
    const lift = sel ? -8 - Math.abs(Math.sin(SEL.t * 5)) * 4 * Math.max(0, 1 - SEL.t * 2) : 0;
    const top = CARD.y + lift;
    ctx.globalAlpha = it.blocked ? .55 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(x - g.w / 2 + 4, top + 8, g.w, g.h, 24); ctx.fill();
    ctx.fillStyle = sel ? '#fffaf0' : 'rgba(255,250,240,.82)'; rr(x - g.w / 2, top, g.w, g.h, 24); ctx.fill();
    if (sel) { ctx.strokeStyle = '#ffb83f'; ctx.lineWidth = 6; rr(x - g.w / 2, top, g.w, g.h, 24); ctx.stroke(); }
    ctx.fillStyle = '#cfe6b8'; ctx.beginPath(); ctx.ellipse(x, top + 200, 70, 12, 0, 0, 7); ctx.fill();
    let title, blurb;
    if (it.kind === 'char') {
      const c = it.c;
      const fr = sel ? (Math.floor(SEL.t * 8) % 4 < 2 && SEL.t < .5 ? c.id + '_jump' : idleFrame(c.id, i)) : c.id + '_idle';
      drawSprite(fr, x, top + 202, charW(c.id, SEL.step === 'sib' ? 108 : Math.min(118, 166 / c.size)), false, 1, 1 + (sel ? Math.sin(G.time * 3) * .015 : 0));
      title = c.name; blurb = c.blurb;
    } else {
      const a = it.a;
      if (a.girl) {
        drawSprite(sel ? idleFrame(a.girl, i) : a.girl + '_idle', x - 20, top + 202, charW(a.girl, 104), false);
        if (a.id === 'lena') for (let k = 0; k < 3; k++) drawPage({ x:x + 46 + (k - 1) * 14, y:top + 90 + k * 26, ph:k * 2 });
        if (a.id === 'hannah') drawKiteShape(x + 52, top + 70, .7);
        if (a.id === 'clara') { drawCampfire(x + 50, top + 200); }
        if (a.id === 'kathy') { drawPie(x + 44, top + 96, .8); drawCritter({ type:'raccoon', x:x + 26, y:top + 176, w:38, h:24, dir:-1, walkT:0 }); }
      } else if (a.id === 'piggy') {
        drawSprite('B_jump', x - 14, top + 202 - 60, charW('B', 52), false);
        drawSprite(sel ? idleFrame('DA', i) : 'DA_idle', x, top + 202, charW('DA', 104), false);
      } else if (a.id === 'roundup') {
        drawSprite('CL_idle', x + 48, top + 202, charW('CL', 58), true);
        drawSprite(sel ? idleFrame('MO', i) : 'MO_idle', x - 14, top + 202, charW('MO', 104), false);
        drawUmbrella(x - 10, top + 46, 38, 1, x, top + 112);
      } else {
        const mama = girlHero ? G.sib : G.hero;
        drawSprite(mama + '_big', x - 20, top + 202, charW(mama, 124, true), false);
        drawSprite(G.hero + '_idle', x + 44, top + 202, charW(G.hero, 66), true);
      }
      title = a.name; blurb = it.blocked ? 'That\'s you!' : a.blurb;
      const prog = PROG[a.id] || 0;
      ctx.fillStyle = prog ? '#2f7a3a' : '#9a8676'; ctx.font = '600 14px Fredoka, sans-serif';
      ctx.fillText(prog ? `Continue: level ${prog + 1} of ${a.levels.length}` : `${a.levels.length} levels`, x, top + 26);
    }
    const fit = (t, size, weight, y, color) => {
      ctx.font = `${weight} ${size}px Fredoka, sans-serif`; const mw = g.w - 18, tw = ctx.measureText(t).width;
      if (tw > mw) ctx.font = `${weight} ${Math.floor(size * mw / tw)}px Fredoka, sans-serif`;
      ctx.fillStyle = color; ctx.fillText(t, x, y);
    };
    fit(title, title.length > 14 ? 22 : 28, 700, top + 238, '#3b2a1e');
    fit(blurb, 16, 400, top + 264, '#7a6656');
    ctx.globalAlpha = 1;
    if (it.blocked) {
      ctx.fillStyle = '#2f7a3a'; rr(x - 34, top - 14, 68, 28, 14); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '600 16px Fredoka, sans-serif'; ctx.fillText('You', x, top + 6);
    }
  });
  ctx.fillStyle = 'rgba(255,250,240,.9)'; rr(W / 2 - 280, 470, 560, 48, 20); ctx.fill();
  ctx.globalAlpha = .6 + .4 * Math.sin(G.time * 4); ctx.fillStyle = '#2f7a3a'; ctx.font = '600 18px Fredoka, sans-serif';
  const hint = isTouch ? (SEL.step === 'hero' ? 'Tap Squatches or Family, then tap who you want to be' : 'Tap to choose')
    : '← → choose   ' + (SEL.step === 'hero' ? '↓ squatches / family   ' : '') + 'Space to pick   Esc back';
  ctx.fillText(hint, W / 2, 500);
  ctx.globalAlpha = 1;
  if (isTouch) {
    ctx.fillStyle = 'rgba(255,250,240,.9)'; rr(16, H - 56, 110, 40, 20); ctx.fill();
    ctx.fillStyle = '#3b2a1e'; ctx.font = '600 18px Fredoka, sans-serif'; ctx.fillText('‹ Back', 71, H - 30);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  if (G.state === 'select') { drawSelect(); return; }
  if (G.state === 'title' || !L) { drawTitle(); return; }
  drawWorld();
  drawHUD();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash})`; ctx.fillRect(0, 0, W, H); }
  switch (G.state) {
    case 'intro': panel(`Level ${advStep()}: ${L.name}`, (isGirl(G.hero) && L.girlTips) || L.tips, pressText()); break;
    case 'mishap': {
      ctx.save(); ctx.textAlign = 'center';
      const s = 1 + Math.max(0, G.timer - 1) * .4;
      ctx.translate(W / 2, H / 2 - 20); ctx.scale(s, s);
      ctx.font = '700 72px Fredoka, sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = '#3b2a1e'; ctx.strokeText(G.mishap.title, 0, 0);
      ctx.fillStyle = '#ffd23f'; ctx.fillText(G.mishap.title, 0, 0);
      ctx.font = '600 26px Fredoka, sans-serif'; ctx.lineWidth = 6; ctx.strokeText(G.mishap.sub, 0, 46); ctx.fillStyle = '#fff'; ctx.fillText(G.mishap.sub, 0, 46);
      ctx.restore(); break;
    }
    case 'gameover': panel('Oh no!', [`${nameOf(G.hero)} got a little too noticed.`, 'Catch your breath and try this part again.', isTouch ? '' : 'Q quits to the menu'], pressText(), '#c0392b'); break;
    case 'paused': {
      ctx.save();
      ctx.fillStyle = 'rgba(10,20,15,.5)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fffaf0'; rr(W / 2 - 200, 110, 400, 358, 26); ctx.fill();
      ctx.textAlign = 'center'; ctx.fillStyle = '#3b2a1e'; ctx.font = '700 40px Fredoka, sans-serif'; ctx.fillText('Paused', W / 2, 168);
      MENU_BTNS.forEach((b, i) => {
        ctx.fillStyle = ['#2f7a3a', '#e9a23b', '#c0583f', '#3b82c4'][i]; rr(b.x, b.y, b.w, b.h, 24); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '600 21px Fredoka, sans-serif'; ctx.fillText(b.label, W / 2, b.y + 31);
        if (!isTouch) { ctx.font = '600 14px Fredoka, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(b.key, b.x + b.w - 22, b.y + 30); }
      });
      ctx.restore(); break;
    }
    case 'win':
      if (G.timer <= 0) {
        const again = isTouch ? 'Tap to play again' : 'Press Space to play again';
        if (L.win) panel(L.win[0], [L.win[1][0], `Berries collected: ${G.berries}`, L.win[1][1]], again, '#2f7a3a');
        else if (isGirl(G.hero)) panel('Home Sweet Home!', [`${nameOf(G.sib)} is back with Mama Squatch.`, `Berries collected: ${G.berries}`, 'Nobody will ever believe your story.'], again, '#2f7a3a');
        else panel('Home Sweet Home!', ['Both baby squatches made it back to Mama.', `Berries collected: ${G.berries}`, 'Nobody will ever believe those blurry photos.'], again, '#2f7a3a');
      }
      break;
  }
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
